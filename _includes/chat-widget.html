<style>
#sa-fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9999}
#sa-box{position:fixed;right:20px;bottom:86px;width:350px;max-width:calc(100vw - 40px);height:460px;max-height:70vh;background:#fff;color:#222;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden;z-index:9999;font-family:inherit}
#sa-box.open{display:flex}
#sa-head{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 14px}
#sa-head b{display:block}#sa-head small{opacity:.85}
#sa-msgs{flex:1;overflow-y:auto;padding:12px;background:#f6f7fb}
.sa-m{max-width:85%;margin:6px 0;padding:8px 12px;border-radius:12px;font-size:.9em;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.sa-bot{background:#fff;border:1px solid #e3e5ee}
.sa-me{background:#667eea;color:#fff;margin-left:auto}
#sa-form{display:flex;border-top:1px solid #e3e5ee;background:#fff}
#sa-in{flex:1;border:0;padding:12px;font-size:.9em;outline:none;background:#fff;color:#222}
#sa-send{border:0;background:none;color:#667eea;font-weight:700;padding:0 14px;cursor:pointer}
</style>
<button id="sa-fab" aria-label="Open AI assistant">✨</button>
<div id="sa-box" role="dialog" aria-label="AI assistant">
  <div id="sa-head"><b>{{ site.assistant_name }}</b><small>Online • Ask me about Sakshi's work</small></div>
  <div id="sa-msgs"><div class="sa-m sa-bot">Hi! 👋 I know all about Sakshi's projects, skills and experience. Ask me anything!</div></div>
  <form id="sa-form"><input id="sa-in" placeholder="Type your question…" autocomplete="off" maxlength="500"><button id="sa-send" type="submit">Send</button></form>
</div>
<script>
(function(){
  var API="{{ site.chat_api_url }}", box=document.getElementById('sa-box'),
      msgs=document.getElementById('sa-msgs'), inp=document.getElementById('sa-in'), hist=[];
  document.getElementById('sa-fab').onclick=function(){box.classList.toggle('open'); if(box.classList.contains('open'))inp.focus();};
  function add(t,c){var d=document.createElement('div');d.className='sa-m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
  document.getElementById('sa-form').onsubmit=async function(e){
    e.preventDefault(); var q=inp.value.trim(); if(!q)return; inp.value=''; add(q,'sa-me');
    var w=add('Thinking…','sa-bot');
    try{
      var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:hist.slice(-6)})});
      var j=await r.json(); var a=j.reply||j.error||'Sorry, something went wrong.';
      w.textContent=a; hist.push({role:'user',content:q},{role:'assistant',content:a});
    }catch(err){w.textContent='Could not reach the assistant. Please try again later.';}
    msgs.scrollTop=msgs.scrollHeight;
  };
})();
</script>
