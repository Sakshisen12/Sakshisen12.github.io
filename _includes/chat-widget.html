<style>
#sa-char{position:fixed;right:12px;bottom:0;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;cursor:pointer;background:none;border:0;padding:0}
#sa-char img{height:170px;width:auto;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));transition:transform .2s}
#sa-char:hover img{transform:translateY(-4px)}
#sa-bubble{position:relative;max-width:210px;margin:0 6px 8px 0;padding:9px 12px;background:#fff;color:#222;border:1px solid #d9dcef;border-radius:12px;font-size:.82em;line-height:1.35;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#sa-bubble:after{content:"";position:absolute;right:34px;bottom:-8px;width:14px;height:14px;background:#fff;border-right:1px solid #d9dcef;border-bottom:1px solid #d9dcef;transform:rotate(45deg)}
#sa-box{position:fixed;right:20px;bottom:190px;width:350px;max-width:calc(100vw - 40px);height:440px;max-height:60vh;background:#fff;color:#222;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden;z-index:9999;font-family:inherit}
#sa-box.open{display:flex}
#sa-head{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
#sa-head b{display:block}#sa-head small{opacity:.85}
#sa-close{background:none;border:0;color:#fff;font-size:1.3em;cursor:pointer}
#sa-msgs{flex:1;overflow-y:auto;padding:12px;background:#f6f7fb}
.sa-m{max-width:85%;margin:6px 0;padding:8px 12px;border-radius:12px;font-size:.9em;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.sa-bot{background:#fff;border:1px solid #e3e5ee;color:#222}
.sa-me{background:#667eea;color:#fff;margin-left:auto}
#sa-form{display:flex;border-top:1px solid #e3e5ee;background:#fff}
#sa-in{flex:1;border:0;padding:12px;font-size:.9em;outline:none;background:#fff;color:#222}
#sa-send{border:0;background:none;color:#667eea;font-weight:700;padding:0 14px;cursor:pointer}
@media(max-width:600px){#sa-char img{height:120px}#sa-box{bottom:135px}#sa-bubble{max-width:170px}}
</style>

<button id="sa-char" aria-label="Open AI assistant">
  <div id="sa-bubble">Hi, I am <b>{{ site.assistant_short_name | default: "Sia" }}</b>! Ask me anything about Sakshi's work ✨</div>
  <img src="{{ site.assistant_image | default: '/images/assistant.svg' }}" alt="AI assistant">
</button>

<div id="sa-box" role="dialog" aria-label="AI assistant">
  <div id="sa-head"><div><b>{{ site.assistant_name }}</b><small>Online • AI Assistant</small></div><button id="sa-close" aria-label="Close">×</button></div>
  <div id="sa-msgs"><div class="sa-m sa-bot">Hello! 👋 I know all about Sakshi's projects, skills and experience. Ask me anything!</div></div>
  <form id="sa-form"><input id="sa-in" placeholder="Type your question…" autocomplete="off" maxlength="500"><button id="sa-send" type="submit">Send</button></form>
</div>
<script>
(function(){
  var API="{{ site.chat_api_url }}", box=document.getElementById('sa-box'),
      bubble=document.getElementById('sa-bubble'),
      msgs=document.getElementById('sa-msgs'), inp=document.getElementById('sa-in'), hist=[];
  function toggle(){box.classList.toggle('open'); bubble.style.display=box.classList.contains('open')?'none':'block'; if(box.classList.contains('open'))inp.focus();}
  document.getElementById('sa-char').onclick=toggle;
  document.getElementById('sa-close').onclick=toggle;
  function add(t,c){var d=document.createElement('div');d.className='sa-m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
  document.getElementById('sa-form').onsubmit=async function(e){
    e.preventDefault(); var q=inp.value.trim(); if(!q)return; inp.value=''; add(q,'sa-me');
    var w=add('Thinking…','sa-bot');
    try{
      var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:hist.slice(-6)})});
      var j=await r.json(); var a=j.reply||j.error||'Sorry, something went wrong.';
      w.textContent=a; hist.push({role:'user',content:q},{role:'assistant',content:a});
    }catch(err){w.textContent='Could not reach the assistant. Please try again later.';}
    msgs.scrollTop=msgs.scrollHeight;
  };
})();
</script>
