{% include base_path %}

<div class="sa-footer">
  <div class="sa-footer__links">
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>{% endif %}
    {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}"><i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn</a>{% endif %}
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope" aria-hidden="true"></i> Email</a>{% endif %}
    <a href="{{ base_path }}/files/Sakshi_Sen-CV.pdf" download><i class="fas fa-file-pdf" aria-hidden="true"></i> CV</a>
  </div>
  <div class="sa-footer__copy">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}. All rights reserved.</div>
</div>
